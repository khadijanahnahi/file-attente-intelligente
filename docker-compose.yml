services:
  db:
    image: postgres:16
    container_name: files-attente-db
    environment:
      POSTGRES_DB: files_attente
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app123
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
