spring.application.name=gestion-files-attente
server.port=8080

# --- Base de données PostgreSQL (créée par database/schema.sql) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/files_attente}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app123}

# validate : Hibernate vérifie que les entités correspondent aux tables, sans rien modifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Casablanca
