spring.application.name=gestion-files-attente
server.port=8080

# --- Base de données PostgreSQL (créée par database/schema.sql) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/files_attente}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

# --- JWT : valeur de développement par défaut (>= 32 caractères).
# En production, définir FILES_JWT_SECRET avec une vraie clé aléatoire.
files.jwt.secret=${FILES_JWT_SECRET:cle-de-developpement-a-remplacer-0123456789-abcdef}
files.jwt.duree-heures=${JWT_DURATION_HOURS:8}

# Origines frontend autorisées, séparées par des virgules
files.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
files.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# validate : Hibernate vérifie que les entités correspondent aux tables, sans rien modifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Casablanca

# --- Règles métier ---
files.delai-absence-minutes=2
files.notifications.bientot-appele=3
files.notification.bientot-appele-position=3
files.nettoyage.cron=0 0 1 * * *

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never